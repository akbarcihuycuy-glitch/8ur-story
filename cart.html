<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Keranjang - 8UR STORY</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- (Paste Header Baru di sini) -->
    <header>
        <div class="logo-container">
            <a href="index.html"><img src="images/logo.png" alt="8UR STORY" class="logo"></a>
        </div>
        <div class="header-right">
            <a href="cart.html" class="cart-container">
                🛒 Keranjang <span class="cart-badge" id="cart-count">0</span>
            </a>
        </div>
    </header>

    <main class="container cart-page">
        <h2>Keranjang Belanja Anda</h2>
        <div id="cart-items-container">
            <!-- Item keranjang akan dimunculkan oleh JavaScript di sini -->
        </div>
        <div style="text-align: right; margin-top: 30px;">
            <h3 id="cart-total" style="font-size: 24px; color: #e74c3c; margin-bottom: 15px;">Total: Rp 0</h3>
            <button class="btn-primary" id="btn-checkout" style="width: 250px;">Lanjut ke Checkout</button>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
