  var rim = new THREE.DirectionalLight(0xffffff, 0.25); rim.position.set(-3,4,-7); scene.add(rim);

  var envScene = new THREE.Scene();
  envScene.add(new THREE.Mesh(new THREE.SphereGeometry(20,24,12), new THREE.MeshBasicMaterial({ color:0x6e6e6e, side:THREE.BackSide })));
  [[0,12,4,12,1,8],[14,3,0,1,8,10],[-14,2,2,1,6,8],[0,4,-14,12,6,1]].forEach(function(p){
    var m = new THREE.Mesh(new THREE.BoxGeometry(p[3],p[4],p[5]), new THREE.MeshBasicMaterial({ color:new THREE.Color(5,5,5) }));
    m.position.set(p[0],p[1],p[2]); envScene.add(m);
  });
  var pmrem = new THREE.PMREMGenerator(renderer);
  scene.environment = pmrem.fromScene(envScene, 0.04).texture;

  var loader = new THREE.TextureLoader();
  var aniso = renderer.capabilities.getMaxAnisotropy();
  function mat(src){
    var t = loader.load(src, function(){ ready(); });
    t.encoding = THREE.sRGBEncoding; t.anisotropy = aniso;
    return new THREE.MeshPhysicalMaterial({ map:t, roughness:0.46, metalness:0, clearcoat:0.35, clearcoatRoughness:0.32, envMapIntensity:0.45 });
  }
  var box = new THREE.Group();
  function face(w,h,src,rx,ry,pos){
    var m = new THREE.Mesh(new THREE.PlaneGeometry(w,h), mat(src));
    m.rotation.set(rx,ry,0); m.position.set(pos[0],pos[1],pos[2]); box.add(m);
  }
  var P = Math.PI/2;
  face(L,W,TEX.top,   -P,0,  [0, D/2,0]);
  face(L,W,TEX.bottom, P,0,  [0,-D/2,0]);
  face(L,D,TEX.front,  0,0,  [0,0, W/2]);
  face(L,D,TEX.back,   0,Math.PI,[0,0,-W/2]);
  face(W,D,TEX.right,  0, P, [ L/2,0,0]);
  face(W,D,TEX.left,   0,-P, [-L/2,0,0]);

  var pivot = new THREE.Group(); pivot.add(box); scene.add(pivot);

  var q0 = new THREE.Quaternion().setFromEuler(new THREE.Euler(0.55,-0.55,0,'YXZ'));
  pivot.quaternion.copy(q0);

  /* ====== Kamera & zoom ====== */
  var zoom = 1, zoomT = 1, baseDist = 10;
  function fit(){
    var w = stage.clientWidth||1, h = stage.clientHeight||1;
    renderer.setSize(w,h,false);
    camera.aspect = w/h; camera.updateProjectionMatrix();
    var vf = camera.fov*Math.PI/180, hf = 2*Math.atan(Math.tan(vf/2)*camera.aspect);
    baseDist = 3.05/Math.sin(Math.min(vf,hf)/2)*1.02;
  }
  fit();
  if (window.ResizeObserver) new ResizeObserver(fit).observe(stage); else addEventListener('resize', fit);

  /* ====== Interaksi: mouse & sentuh ====== */
  var X = new THREE.Vector3(1,0,0), Y = new THREE.Vector3(0,1,0);
  var ptrs = new Map(), lastPinch = 0, vx = 0, vy = 0, lastT = performance.now(), lastInput = 0, autoK = 0;
  var hint = document.getElementById('hint');
  function touched(){ lastInput = performance.now(); hint.classList.add('off'); }
  function spin(dx,dy){
    var qy = new THREE.Quaternion().setFromAxisAngle(Y, dx), qx = new THREE.Quaternion().setFromAxisAngle(X, dy);
    pivot.quaternion.premultiply(qy).premultiply(qx).normalize();
  }
  stage.addEventListener('pointerdown', function(e){
    stage.setPointerCapture(e.pointerId);
    ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY}); stage.classList.add('drag'); vx=vy=0; touched();
    if (ptrs.size===2) lastPinch = pinchDist();
  });
  stage.addEventListener('pointermove', function(e){
    var p = ptrs.get(e.pointerId); if(!p) return;
    var dx = e.clientX-p.x, dy = e.clientY-p.y; p.x=e.clientX; p.y=e.clientY; touched();
    if (ptrs.size===1){ var k=0.008; spin(dx*k,dy*k); vx=dx*k; vy=dy*k; }
    else if (ptrs.size===2){ var d=pinchDist(); if(lastPinch) zoomT = clamp(zoomT*d/lastPinch); lastPinch=d; }
  });
  function end(e){ ptrs.delete(e.pointerId); lastPinch=0; if(!ptrs.size) stage.classList.remove('drag'); touched(); }
  stage.addEventListener('pointerup', end); stage.addEventListener('pointercancel', end);
  stage.addEventListener('wheel', function(e){
    if(!WHEEL_ZOOM) return; e.preventDefault(); touched();
    zoomT = clamp(zoomT*Math.exp(-e.deltaY*0.0015));
  }, { passive:false });
  stage.addEventListener('dblclick', reset);
  function pinchDist(){ var a=Array.from(ptrs.values()); return Math.hypot(a[0].x-a[1].x, a[0].y-a[1].y); }
  function clamp(z){ return Math.min(ZOOM_MAX, Math.max(ZOOM_MIN, z)); }
  function reset(){ pivot.quaternion.copy(q0); zoomT=1; vx=vy=0; touched(); }
  document.getElementById('zin').onclick  = function(){ zoomT = clamp(zoomT*1.25); touched(); };
  document.getElementById('zout').onclick = function(){ zoomT = clamp(zoomT/1.25); touched(); };
  document.getElementById('rst').onclick  = reset;
  stage.tabIndex = 0;
  stage.addEventListener('keydown', function(e){
    var k=0.12; touched();
    if(e.key==='ArrowLeft') spin(-k,0); else if(e.key==='ArrowRight') spin(k,0);
    else if(e.key==='ArrowUp') spin(0,-k); else if(e.key==='ArrowDown') spin(0,k);
    else if(e.key==='+'||e.key==='=') zoomT=clamp(zoomT*1.15); else if(e.key==='-') zoomT=clamp(zoomT/1.15);
  });

  /* ====== Loop ====== */
  var loaded = 0;
  function ready(){ if(++loaded>=6) document.body.dataset.ready = '1'; }
  var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  function frame(now){
    requestAnimationFrame(frame);
    var dt = Math.min((now-lastT)/1000, 0.05); lastT = now;
    var dragging = ptrs.size>0;
    if(!dragging){
      if(Math.abs(vx)>1e-4||Math.abs(vy)>1e-4){ spin(vx,vy); var f=Math.pow(0.04,dt); vx*=f; vy*=f; }
      var idle = AUTO_ROTATE && !reduce && (now-lastInput>IDLE_MS);
      autoK += ((idle?1:0)-autoK)*Math.min(1,dt*2.5);
      if(autoK>0.002) spin(AUTO_SPEED*dt*autoK,0);
    } else autoK = 0;
    zoom += (zoomT-zoom)*Math.min(1,dt*10);
    camera.position.set(0,0,baseDist/zoom); camera.lookAt(0,0,0);
    renderer.render(scene,camera);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
